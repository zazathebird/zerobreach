[package]
name = "zerobreach-native"
version = "0.1.0"
description = "ZeroBreach Kraken Console — native shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "net"] }
# Strips the \\?\ extended-length-path prefix that resource_dir()/canonicalize() return on
# Windows — ZeroBreach-Server.ps1 was never written expecting to see that prefix in
# $PSScriptRoot-derived paths, and it broke every route (500 on GET / — see main.rs).
dunce = "1"

[target.'cfg(windows)'.dependencies]
# Job Object with KILL_ON_JOB_CLOSE: ties the elevated ZeroBreach-Server.ps1 child's lifetime to
# this process's at the OS level, not just to the cooperative Tauri events (window-close /
# ExitRequested) — a force-kill (Task Manager "End Task", a panic, a crash) bypasses both of
# those and orphans a still-listening elevated PowerShell HTTP server with no UI telling the
# operator it's alive (found in review 2026-07-26).
windows-sys = { version = "0.59", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
